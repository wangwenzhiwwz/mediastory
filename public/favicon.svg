<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#242B35"/>
      <stop offset="100%" stop-color="#0C0E12"/>
    </radialGradient>
    <linearGradient id="lensGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFBE18"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Obsidian Badge Background -->
  <circle cx="256" cy="256" r="238" fill="url(#bg)" stroke="#2D343E" stroke-width="6"/>

  <g filter="url(#glow)">
    <!-- Fluid Dual Arch M / W Monogram -->
    <path d="M 124 336 C 124 212, 168 152, 212 152 C 242 152, 253 192, 256 218 C 259 192, 270 152, 300 152 C 344 152, 388 212, 388 336" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="46" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Golden Director Lens / Record Accent Dot -->
    <circle cx="256" cy="326" r="24" fill="url(#lensGold)"/>
  </g>
</svg>